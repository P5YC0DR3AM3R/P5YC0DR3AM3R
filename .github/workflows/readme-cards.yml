name: README Cards

on:
  schedule:
    # Daily at 06:17 UTC. Off the hour so it is not queued with every other
    # cron job on the runner fleet.
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Regenerate as soon as a generator lands, so a README image is never
  # pointing at a file that does not exist yet.
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-cards.yml"
      - "scripts/generate-top-languages.mjs"
      - "scripts/generate-streak.mjs"

permissions:
  contents: write

# Both cards are generated and committed by this one job. Splitting them into
# separate workflows would put two runs on the same schedule racing to push to
# main, and the loser fails on a non-fast-forward.
concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate top languages card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-top-languages.mjs

      - name: Generate streak card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-streak.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-languages.svg assets/streak.svg
          if git diff --staged --quiet; then
            echo "No card changes."
          else
            git commit -m "chore: refresh README cards"
            git push
          fi
