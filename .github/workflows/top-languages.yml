name: Top Languages

on:
  schedule:
    # Daily at 06:17 UTC. Off the hour so it is not queued with every other
    # cron job on the runner fleet.
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Regenerate as soon as the generator lands, so the README image is never
  # pointing at a file that does not exist yet.
  push:
    branches: [main]
    paths:
      - ".github/workflows/top-languages.yml"
      - "scripts/generate-top-languages.mjs"

permissions:
  contents: write

concurrency:
  group: top-languages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-top-languages.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-languages.svg
          if git diff --staged --quiet; then
            echo "No language changes."
          else
            git commit -m "chore: refresh top languages card"
            git push
          fi
